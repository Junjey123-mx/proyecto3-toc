---
# Máquina de referencia para las pruebas del simulador (no es una máquina de demostración).
# Transcripción del Laboratorio 10, ejercicio 1: L = {α#α | α ∈ {a, b}*}, con q0..q5 escritos
# como '0'..'5'. Es la versión completa del ejemplo incompleto del enunciado (pp. 2-3): cada
# regla δ([q, w], s) con w ∈ {a, b} se expande en una regla por valor de caché.
q_states:
  q_list:
  - '0'
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  initial: '0'
  final: '5'
alphabet:
- a
- b
- "#"
tape_alphabet:
- a
- b
- "#"
- X
-
delta:
# q0: guarda en caché el primer símbolo pendiente de la primera cadena y lo borra;
# al leer # ya no quedan pendientes y pasa a la verificación final (q4).
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value: a
    tape_output:
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '1'
    mem_cache_value: b
    tape_output:
    tape_displacement: R
- params:
    initial_state: '0'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: '4'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: R
# q1: avanza sobre la primera cadena conservando la caché hasta el separador.
- params:
    initial_state: '1'
    mem_cache_value: a
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value: a
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value: a
    tape_input: b
  output:
    final_state: '1'
    mem_cache_value: a
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value: a
    tape_input: "#"
  output:
    final_state: '2'
    mem_cache_value: a
    tape_output: "#"
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value: b
    tape_input: a
  output:
    final_state: '1'
    mem_cache_value: b
    tape_output: a
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value: b
    tape_input: b
  output:
    final_state: '1'
    mem_cache_value: b
    tape_output: b
    tape_displacement: R
- params:
    initial_state: '1'
    mem_cache_value: b
    tape_input: "#"
  output:
    final_state: '2'
    mem_cache_value: b
    tape_output: "#"
    tape_displacement: R
# q2: salta los marcadores X; si el símbolo coincide con la caché lo marca con X.
- params:
    initial_state: '2'
    mem_cache_value: a
    tape_input: X
  output:
    final_state: '2'
    mem_cache_value: a
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value: a
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: X
    tape_displacement: L
- params:
    initial_state: '2'
    mem_cache_value: b
    tape_input: X
  output:
    final_state: '2'
    mem_cache_value: b
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '2'
    mem_cache_value: b
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: X
    tape_displacement: L
# q3: regresa a la izquierda hasta el blanco que precede a la primera cadena.
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: X
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: X
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: "#"
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: "#"
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: a
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: a
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input: b
  output:
    final_state: '3'
    mem_cache_value:
    tape_output: b
    tape_displacement: L
- params:
    initial_state: '3'
    mem_cache_value:
    tape_input:
  output:
    final_state: '0'
    mem_cache_value:
    tape_output:
    tape_displacement: R
# q4: comprueba que la segunda cadena solo tenga marcadores y acepta en q5.
- params:
    initial_state: '4'
    mem_cache_value:
    tape_input: X
  output:
    final_state: '4'
    mem_cache_value:
    tape_output: X
    tape_displacement: R
- params:
    initial_state: '4'
    mem_cache_value:
    tape_input:
  output:
    final_state: '5'
    mem_cache_value:
    tape_output:
    tape_displacement: R
simulation_strings:
# Cadenas del enunciado y del Laboratorio 10 (incisos b y c).
- aab#aab
- ab#ab
- abbababa#aba
- abb#aab
- "#"
